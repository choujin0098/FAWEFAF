  <title>Library Homepage</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f8f5ed;
      --paper: #fffdf8;
      --forest: #1d4a3b;
      --deep-forest: #12352b;
      --sage: #dce7d9;
      --beige-border: #ded7c7;
      --ink: #24382e;
      --muted: #6d766d;
      --gold: #c99545;
    }

    * { box-sizing: border-box; }
    html { background: var(--ivory); }
    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background: var(--ivory);
      color: var(--ink);
      font-family: "Work Sans", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    .page-shell { width: 100%; min-height: calc(100 * min(var(--vh, 1vh), 1vh)); }

    .library-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: 210px;
      padding: 25px 15px;
      background: #f0eee5;
      border-right: 1px solid var(--beige-border);
      display: flex;
      flex-direction: column;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--forest);
      color: white;
      box-shadow: 0 5px 13px rgba(29, 74, 59, .16);
    }

    .brand-name, h1, h2, h3, .book-title {
      font-family: "Source Serif Pro", serif;
    }

    .nav-link, .service-button, .account-button, .announcement-card, .book-card {
      transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease, border-color .18s ease, color .18s ease;
    }

    .nav-link:hover, .nav-link:focus-visible {
      background: #e2e7dc;
      color: var(--deep-forest);
    }

    .nav-link.is-active {
      background: var(--forest);
      color: white;
      box-shadow: 0 5px 12px rgba(29, 74, 59, .14);
    }

    .main-area {
      width: calc(100% - 210px);
      margin-left: 210px;
      padding: 26px 30px 44px 24px;
    }

    .main-inner {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--beige-border);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      padding: 0 16px 0 43px;
      outline: none;
      box-shadow: 0 2px 7px rgba(42, 51, 39, .04);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search-input:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(29, 74, 59, .12);
    }

    .account-button {
      min-width: 108px;
      min-height: 42px;
      padding: 0 13px;
      border-radius: 7px;
      border: 1px solid var(--beige-border);
      background: transparent;
      color: var(--forest);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .account-button:hover, .account-button:focus-visible {
      border-color: var(--forest);
      background: #edf3ea;
    }

    .signup-button {
      background: var(--forest);
      border-color: var(--forest);
      color: #fff;
    }

    .signup-button:hover, .signup-button:focus-visible {
      background: var(--deep-forest);
      border-color: var(--deep-forest);
    }

    .service-button {
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #536259;
      padding: 9px 12px;
      min-height: 42px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .service-button:hover, .service-button:focus-visible, .service-button.is-active {
      color: var(--forest);
      background: #e7ede4;
    }

    .section-heading {
      color: var(--deep-forest);
      letter-spacing: .09em;
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 13px;
    }

    .announcement-card {
      min-height: 128px;
      padding: 18px;
      text-align: left;
      border: 1px solid var(--beige-border);
      border-radius: 9px;
      background: var(--paper);
      box-shadow: 0 4px 12px rgba(42, 51, 39, .045);
    }

    .announcement-card:hover, .announcement-card:focus-visible {
      transform: translateY(-3px);
      border-color: #acbca8;
      box-shadow: 0 10px 18px rgba(42, 51, 39, .09);
    }

    .book-card {
      border: 0;
      background: transparent;
      padding: 0;
      text-align: left;
      min-width: 0;
    }

    .book-card:hover .book-cover, .book-card:focus-visible .book-cover {
      transform: translateY(-4px);
      box-shadow: 0 14px 22px rgba(20, 43, 34, .19);
    }

    .book-card:focus-visible { outline: 3px solid rgba(29, 74, 59, .28); outline-offset: 5px; border-radius: 7px; }

    .book-cover {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4.05;
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 7px 15px rgba(20, 43, 34, .13);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .book-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      pointer-events: none;
    }

    .cover-moon { background: linear-gradient(145deg, #183c45 0%, #285d5d 57%, #d5b865 57%, #d5b865 61%, #f1e5ba 61%); }
    .cover-orchard { background: linear-gradient(160deg, #c9533d 0%, #dc7856 62%, #f5dca9 62%); }
    .cover-margins { background: linear-gradient(135deg, #ede4d0, #d9c8a8); }
    .cover-tide { background: linear-gradient(155deg, #163e67 0%, #387ca0 58%, #dce6d8 58%); }
    .cover-garden { background: linear-gradient(145deg, #243d2f 0%, #54734a 55%, #c9aa59 55%); }
    .cover-station { background: linear-gradient(145deg, #593d4a 0%, #a26d75 60%, #e5c8a3 60%); }
    .cover-field { background: linear-gradient(145deg, #d5b454 0%, #e8d583 58%, #496151 58%); }
    .cover-letters { background: linear-gradient(145deg, #d9d1c1 0%, #f6f0e3 60%, #6c8876 60%); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(18, 53, 43, .42);
    }

    .modal-backdrop.is-open { display: flex; }

    .modal-panel {
      width: min(420px, 100%);
      padding: 28px;
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid #e7dfd0;
      box-shadow: 0 22px 50px rgba(18, 53, 43, .24);
      animation: rise .2s ease both;
    }

    @keyframes rise {
      from { transform: translateY(10px); opacity: .4; }
      to { transform: translateY(0); opacity: 1; }
    }

    .focus-ring:focus-visible {
      outline: 3px solid rgba(29, 74, 59, .34);
      outline-offset: 2px;
    }

    @media (max-width: 980px) {
      .library-sidebar {
        position: static;
        width: 100%;
        min-height: auto;
        padding: 15px 18px;
        flex-direction: row;
        align-items: center;
        gap: 18px;
      }
      .library-sidebar nav { flex: 1; overflow-x: auto; }
      .library-sidebar nav ul { display: flex; gap: 5px; }
      .library-sidebar .sidebar-bottom { display: none; }
      .main-area { width: 100%; margin-left: 0; padding: 22px 20px 35px; }
    }

    @media (max-width: 720px) {
      .header-row { align-items: stretch; flex-direction: column; }
      .account-controls { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
      .account-button { min-width: 0; padding: 0 7px; }
      .announcement-grid { grid-template-columns: 1fr; }
      .popular-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .recommend-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      .library-sidebar { align-items: flex-start; flex-direction: column; }
      .library-sidebar nav { width: 100%; }
      .popular-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .recommend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .account-controls { gap: 6px; }
      .account-button { font-size: 10px; }
    }
  </style>

  <div id="action-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
   <div class="modal-panel">
    <p data-template-id="modal-eyebrow" class="canva-text m-0 text-[10px] font-bold uppercase tracking-[.16em] text-[#69806e]" style="color: rgb(105, 128, 110); font-weight: 700;">LibriNova Library</p>
    <h2 data-template-id="modal-title" id="modal-title" class="canva-text mt-2 text-[25px] font-semibold text-[#173b30]" style="color: rgb(23, 59, 48); font-family: &quot;Source Serif Pro&quot;; font-weight: 600;">Library notice</h2>
    <p id="modal-message" class="m-0 text-[14px] leading-relaxed text-[#59665c]"></p><button data-template-id="modal-close" id="modal-close" type="button" class="canva-button focus-ring mt-6 rounded-md bg-[#1d4a3b] px-4 py-2 text-[12px] font-bold text-white" style="background: rgb(29, 74, 59); color: rgb(255, 255, 255); font-weight: 700;">Close</button>
   </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const modal = document.getElementById("action-modal");
      const modalMessage = document.getElementById("modal-message");
      const closeButton = document.getElementById("modal-close");
      let triggerElement = null;

      function openModal(message, trigger) {
        triggerElement = trigger;
        modalMessage.textContent = message;
        modal.classList.add("is-open");
        closeButton.focus();
      }

      function closeModal() {
        modal.classList.remove("is-open");
        if (triggerElement) triggerElement.focus();
      }

      document.querySelectorAll("[data-modal-message]").forEach(function (button) {
        button.addEventListener("click", function () {
          if (button.classList.contains("service-button") && button.textContent.includes("My Loans")) {
            window.location.href = "borrowed.html";
            return;
          }
          if (button.classList.contains("book-card")) {
            const bookIds = {
              "The Paper Moon": "paper-moon",
              "The Last Orchard": "last-orchard",
              "Margins of Light": "margins-of-light",
              "Quiet Tide": "quiet-tide",
              "The Garden Map": "garden-map",
              "Station at Dusk": "station-at-dusk",
              "A Field Guide to Small Wonders": "small-wonders",
              "Letters for Winter": "letters-for-winter"
            };
            const bookId = bookIds[button.dataset.searchTitle];
            if (bookId) window.location.href = "book.html?id=" + encodeURIComponent(bookId);
            return;
          }
          if (button.classList.contains("nav-link")) {
            document.querySelectorAll(".nav-link").forEach(function (item) {
              item.classList.remove("is-active");
              item.removeAttribute("aria-current");
            });
            button.classList.add("is-active");
            button.setAttribute("aria-current", "page");
          }
          if (button.classList.contains("service-button")) {
            document.querySelectorAll(".service-button").forEach(function (item) {
              item.classList.remove("is-active");
            });
            button.classList.add("is-active");
          }
          openModal(button.dataset.modalMessage, button);
        });
      });

      closeButton.addEventListener("click", closeModal);
      modal.addEventListener("click", function (event) {
        if (event.target === modal) closeModal();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && modal.classList.contains("is-open")) closeModal();
      });

      const search = document.getElementById("library-search");
      const status = document.getElementById("search-status");
      const cards = Array.from(document.querySelectorAll(".book-card"));

      search.addEventListener("input", function () {
        const query = search.value.trim().toLowerCase();
        let matches = 0;
        cards.forEach(function (card) {
          const title = card.dataset.searchTitle.toLowerCase();
          const matchesQuery = !query || title.includes(query);
          card.style.display = matchesQuery ? "" : "none";
          if (matchesQuery) matches++;
        });

        if (query) {
          status.classList.remove("hidden");
          status.textContent = matches + (matches === 1 ? " title found for “" : " titles found for “") + search.value.trim() + "”.";
        } else {
          status.classList.add("hidden");
        }
      });
    });
  </script>
